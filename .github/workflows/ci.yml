name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run check:contract
      - run: npm run typecheck
      - run: npm test

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Export local Supabase key
        run: echo "SUPABASE_SECRET_KEY=$(supabase status -o json | jq -r .SECRET_KEY)" >> "$GITHUB_ENV"
      - name: Test database and complete ingest path
        run: npm run test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
          SUPABASE_URL: http://127.0.0.1:55321
